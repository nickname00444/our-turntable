<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>우리만의 턴테이블</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-center: #362254;
      --bg-mid: #1d1438;
      --bg-edge: #110c21;
      --vinyl-base: #161321;
      --vinyl-highlight: #2b2340;
      --label-color: #e57a94;
      --arm-color: #e6dce8;
      --head-color: #f29bb0;
      --glow-rgba: rgba(229, 122, 148, 0.22);
      --modal-bg: rgba(26, 18, 48, 0.88);
      --modal-border: rgba(255, 205, 220, 0.22);
      --accent-color: #e57a94;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 38%, var(--bg-center) 0%, var(--bg-mid) 52%, var(--bg-edge) 100%);
      color: #f4eef8;
      font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      transition: background 0.5s ease;
    }

    .ambient-halo {
      background: radial-gradient(circle, var(--glow-rgba) 0%, rgba(157, 107, 224, 0.12) 45%, transparent 72%);
      filter: blur(28px);
      pointer-events: none;
      transition: background 0.5s ease;
    }

    .vinyl-grooves {
      background:
        radial-gradient(circle at center,
          transparent 0%,
          transparent 31%,
          rgba(255, 255, 255, 0.05) 31.5%,
          transparent 32%,
          rgba(0, 0, 0, 0.55) 36%,
          rgba(255, 255, 255, 0.03) 42%,
          rgba(0, 0, 0, 0.6) 48%,
          rgba(255, 255, 255, 0.04) 55%,
          rgba(0, 0, 0, 0.55) 62%,
          rgba(255, 255, 255, 0.035) 69%,
          rgba(0, 0, 0, 0.65) 76%,
          rgba(255, 255, 255, 0.04) 84%,
          rgba(0, 0, 0, 0.85) 95%,
          #090712 100%
        ),
        conic-gradient(
          from 35deg,
          var(--vinyl-base) 0deg,
          var(--vinyl-highlight) 38deg,
          var(--vinyl-base) 85deg,
          var(--vinyl-base) 145deg,
          var(--vinyl-highlight) 215deg,
          var(--vinyl-base) 275deg,
          var(--vinyl-base) 360deg
        );
      box-shadow:
        0 24px 60px rgba(6, 4, 16, 0.85),
        0 0 0 1px rgba(255, 255, 255, 0.07),
        inset 0 0 18px rgba(0, 0, 0, 0.85);
    }

    .vinyl-sheen {
      background: conic-gradient(
        from 15deg,
        transparent 0deg,
        rgba(255, 225, 235, 0.1) 28deg,
        transparent 62deg,
        transparent 180deg,
        rgba(196, 168, 255, 0.09) 208deg,
        transparent 245deg,
        transparent 360deg
      );
      pointer-events: none;
    }

    .vinyl-label {
      background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--label-color) 75%, white) 0%, var(--label-color) 58%, color-mix(in srgb, var(--label-color) 70%, black) 100%);
      box-shadow:
        inset 0 0 0 2px rgba(255, 235, 240, 0.25),
        inset 0 2px 8px rgba(255, 255, 255, 0.3),
        0 2px 10px rgba(0, 0, 0, 0.65);
    }

    .glass-pill {
      background: var(--modal-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--modal-border);
      box-shadow: 0 14px 38px rgba(7, 4, 18, 0.65);
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    input[type="text"] {
      user-select: text;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }
    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch {
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      border-radius: 9999px;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.22);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen px-4 py-5 sm:py-7">

  <div id="ytPlayerWrapper" class="fixed -left-[9999px] -top-[9999px] w-1 h-1 opacity-0 pointer-events-none">
    <div id="ytPlayer"></div>
  </div>
  <audio id="localAudio" crossorigin="anonymous"></audio>

  <!-- Top Bar -->
  <header class="w-full max-w-md flex items-center justify-between z-30">
    <div class="w-8"></div>

    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/[0.05] border border-white/[0.08]">
      <span id="syncDot" class="w-2 h-2 rounded-full transition-colors duration-500" style="background-color: var(--accent-color);"></span>
      <span id="syncText" class="text-[11px] tracking-wider text-white/75 font-light">연결 중</span>
    </div>

    <button id="themeOpenBtn" type="button" title="색상 및 분위기 설정" class="w-8 h-8 rounded-full bg-white/[0.06] hover:bg-white/[0.14] border border-white/[0.1] text-white/80 flex items-center justify-center transition">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
        <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
        <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
        <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z" />
      </svg>
    </button>
  </header>

  <!-- Centerpiece: Turntable -->
  <main class="relative flex items-center justify-center my-auto w-full max-w-[410px] aspect-square">
    <div class="ambient-halo absolute inset-4 rounded-full"></div>

    <div id="turntableDeck" class="relative w-[92%] h-[92%] rounded-[42px] bg-black/30 backdrop-blur-md border border-white/[0.1] shadow-[0_30px_80px_rgba(5,3,15,0.85),inset_0_1px_1px_rgba(255,255,255,0.12)] flex items-center justify-center">

      <div class="relative w-[82%] h-[82%] -translate-x-[4%] rounded-full bg-[#0c0917] p-[5px] shadow-[inset_0_2px_10px_rgba(0,0,0,0.95),0_1px_0_rgba(255,255,255,0.06)] flex items-center justify-center">

        <div id="vinylDisc" class="relative w-full h-full rounded-full vinyl-grooves flex items-center justify-center will-change-transform">
          <div class="vinyl-label relative w-[33%] h-[33%] rounded-full flex items-center justify-center overflow-hidden">
            <img id="labelCover" src="" alt="" class="hidden absolute inset-0 w-full h-full object-cover opacity-80 mix-blend-luminosity" />
            <div class="w-[74%] h-[74%] rounded-full border border-white/25 flex items-center justify-center">
              <div class="w-[22%] h-[22%] rounded-full bg-gradient-to-br from-zinc-100 via-zinc-300 to-zinc-500 shadow-[0_2px_4px_rgba(0,0,0,0.7)] border border-black/30"></div>
            </div>
          </div>
        </div>

        <div class="vinyl-sheen absolute inset-[5px] rounded-full"></div>
      </div>

      <button id="crackleBtn" type="button" title="LP 지지직 노이즈" class="absolute bottom-5 left-5 w-7 h-7 rounded-full bg-white/[0.05] hover:bg-white/[0.12] border border-white/[0.1] flex items-center justify-center transition-all">
        <span id="crackleLed" class="w-1.5 h-1.5 rounded-full transition-all"></span>
      </button>

      <div class="absolute right-[9.5%] top-[52%] w-3.5 h-6 rounded-full bg-black/50 border border-white/10 shadow-inner pointer-events-none"></div>

      <!-- Tonearm Switch -->
      <div id="tonearmPivot"
           style="top: 14%; right: 11%; width: 0; height: 0; transform: rotate(2deg);"
           class="absolute z-30 cursor-grab active:cursor-grabbing touch-none">

        <div class="absolute -translate-x-1/2 -translate-y-1/2 w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-gradient-to-br from-white/20 via-black/60 to-black/90 border border-white/15 shadow-[0_8px_18px_rgba(0,0,0,0.75)] flex items-center justify-center pointer-events-none">
          <div id="pivotCap" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full shadow-inner border border-black/30" style="background: radial-gradient(circle at 35% 35%, #ffffff, var(--arm-color));"></div>
        </div>

        <div class="absolute -translate-x-1/2 -translate-y-[145%] w-5 h-6 rounded-sm shadow-md border border-black/30 pointer-events-none" style="background: linear-gradient(90deg, rgba(0,0,0,0.3), var(--arm-color), rgba(0,0,0,0.35));"></div>

        <svg id="tonearmSvg" viewBox="-40 -10 80 230" class="absolute -left-[40px] -top-[10px] w-[80px] h-[215px] sm:h-[235px] overflow-visible drop-shadow-[0_10px_14px_rgba(0,0,0,0.7)]
